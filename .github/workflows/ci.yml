name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check droplet secrets
        id: gate
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DROPLET_HOST is not set, skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # The droplet keeps a clone at /opt/family-feud, with .env and a deploy key beside it.
      # Deploy never deletes ./data. Migrations run when the server starts.
      - name: Deploy
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /opt/family-feud
            git pull --ff-only
            docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
